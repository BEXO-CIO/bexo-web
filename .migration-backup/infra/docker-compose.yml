version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bexo-postgres
    restart: always
    environment:
      POSTGRES_USER: bexo
      POSTGRES_PASSWORD: bexo_dev_password
      POSTGRES_DB: bexo_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bexo-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: bexo-minio
    restart: always
    environment:
      MINIO_ROOT_USER: bexo_admin
      MINIO_ROOT_PASSWORD: bexo_minio_secret
    ports:
      - '9000:9000' # API
      - '9001:9001' # Web Console
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
